[project]
name = "hermes-visual-memory"
version = "0.1.0"
description = "Visual memory for Hermes: remembers what the Echo Show's camera saw, and what changed."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vismem = "vismem.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vismem"]
